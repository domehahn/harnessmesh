stages:
  - validate
  - test
  - release

variables:
  GOTOOLCHAIN: local
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

go-validate:
  image: golang:1.25-bookworm
  stage: validate
  script:
    - test "$(go version | awk '{print $3}')" != ""
    - gofmt_files="$(gofmt -l $(git ls-files '*.go'))"
    - test -z "$gofmt_files"
    - go vet ./...
    - go build ./cmd/harnessmesh

go-test:
  image: golang:1.25-bookworm
  stage: test
  script:
    - go test -race ./...
    - go test ./internal/knowledge -run FuzzArchiveSearchDoesNotPanic

frontend-test:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  stage: test
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm run typecheck
    - npm run build
    - npm run test:smoke
    - npm run test:e2e

release-artifacts:
  image: golang:1.25-bookworm
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_TAG == "v0.2.0"'
  script:
    - mkdir -p dist
    - CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X main.version=${CI_COMMIT_TAG#v}" -o dist/harnessmesh ./cmd/harnessmesh
    - sha256sum dist/harnessmesh > dist/SHA256SUMS
  artifacts:
    name: "harnessmesh-${CI_COMMIT_TAG}"
    paths:
      - dist/

services:
  harnessmesh:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ./harnessmesh.json:/etc/harnessmesh/harnessmesh.json:ro
    environment:
      HOME: /tmp/harnessmesh-home
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - print-config
      - --config
      - /etc/harnessmesh/harnessmesh.json

  # Remote MCP server (e.g. for a ChatGPT remote MCP connector). Not started
  # by default; enable explicitly with `docker compose --profile mcp up`.
  # HARNESSMESH_MCP_TOKEN must be set in the environment - there is no
  # default, and the server refuses to start without it.
  harnessmesh-mcp:
    profiles: ["mcp"]
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ./harnessmesh.json:/etc/harnessmesh/harnessmesh.json:ro
      - harnessmesh-data:/data
    environment:
      HOME: /data
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_MCP_TOKEN: ${HARNESSMESH_MCP_TOKEN:?HARNESSMESH_MCP_TOKEN must be set}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Loopback-only by default. Put a TLS-terminating reverse proxy or the
    # OpenAI-supported secure tunnel mechanism in front for remote access -
    # see docs/chatgpt-integration.md. Never publish 0.0.0.0 here.
    ports:
      - "127.0.0.1:8787:8787"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - mcp
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --repo
      - /workspace
      - --listen
      - 0.0.0.0:8787
      - --token
      - ${HARNESSMESH_MCP_TOKEN:?HARNESSMESH_MCP_TOKEN must be set}

  # Local REST+WebSocket bridge for the VS Code extension. Not started by
  # default; enable explicitly with `docker compose --profile bridge up`.
  # In most developer setups this runs on the host via `harnessmesh bridge
  # serve` instead of in a container, since the VS Code extension host
  # itself runs on the host - this service exists for containerized/remote
  # development environments.
  harnessmesh-bridge:
    profiles: ["bridge"]
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ./harnessmesh.json:/etc/harnessmesh/harnessmesh.json:ro
      - harnessmesh-data:/data
    environment:
      HOME: /data
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_BRIDGE_TOKEN: ${HARNESSMESH_BRIDGE_TOKEN:?HARNESSMESH_BRIDGE_TOKEN must be set}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8788:8788"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - bridge
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --repo
      - /workspace
      - --listen
      - 0.0.0.0:8788
      - --token
      - ${HARNESSMESH_BRIDGE_TOKEN:?HARNESSMESH_BRIDGE_TOKEN must be set}

  # Codex-compatible model-provider gateway (POST /v1/responses). Not
  # started by default; enable explicitly with `docker compose --profile
  # provider up`. This service has no collaboration-plane state at all - it
  # does not mount the harnessmesh-data volume - and never needs
  # OPENAI_API_KEY unless an operator has deliberately disabled
  # zero_credit_mode and configured an "openai-api" backend (not done
  # here). By default it only reaches the "local" backend on the Docker
  # network's host gateway; adjust HARNESSMESH_PROVIDER_LOCAL_BACKEND_URL
  # to point at your actual local inference server.
  # The default config below selects chatgpt-subscription. Override
  # HARNESSMESH_PROVIDER_CONFIG for a local/Bedrock profile.
  harnessmesh-provider:
    profiles: ["provider"]
    build:
      context: .
    user: "${HARNESSMESH_UID:-10001}:${HARNESSMESH_GID:-10001}"
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ${HARNESSMESH_PROVIDER_CONFIG:-configs/codex-chatgpt.example.json}:/etc/harnessmesh/harnessmesh.json:ro
      # The loopback OAuth callback runs on the host. Sharing this directory
      # lets the container reuse the host-authorized SIWC credential and
      # refresh it when necessary.
      - ${HARNESSMESH_SIWC_HOME:-.harnessmesh}:/data/.harnessmesh
    environment:
      HOME: /data
      HARNESSMESH_PROVIDER_TOKEN: ${HARNESSMESH_PROVIDER_TOKEN:?HARNESSMESH_PROVIDER_TOKEN must be set}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8789:8789"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - provider
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --listen
      - 0.0.0.0:8789

volumes:
  # Persistent collaboration-state database (tasks, findings, evidence,
  # reviews, decisions) so it survives container restarts, per HarnessMesh's
  # durability requirements. Never mounted read_only.
  harnessmesh-data:

services:
  # Local S3-compatible artifact storage for the managed marketplace. Production
  # uses S3/R2/MinIO behind the configured CDN and the same artifact contract.
  harnessmesh-minio:
    profiles: ["marketplace"]
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    environment:
      MINIO_ROOT_USER: ${HARNESSMESH_OBJECTSTORE_ACCESS_KEY:-harnessmesh}
      MINIO_ROOT_PASSWORD: ${HARNESSMESH_OBJECTSTORE_SECRET_KEY:-harnessmesh-local-secret}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${HARNESSMESH_OBJECTSTORE_PORT:-9000}:9000"
      - "127.0.0.1:${HARNESSMESH_OBJECTSTORE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - harnessmesh-objectstore-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  harnessmesh-marketplace-bucket:
    profiles: ["marketplace"]
    image: minio/mc:RELEASE.2025-02-15T10-36-16Z
    depends_on:
      harnessmesh-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${HARNESSMESH_OBJECTSTORE_ACCESS_KEY:-harnessmesh}
      MINIO_ROOT_PASSWORD: ${HARNESSMESH_OBJECTSTORE_SECRET_KEY:-harnessmesh-local-secret}
      HARNESSMESH_MARKETPLACE_BUCKET: ${HARNESSMESH_MARKETPLACE_BUCKET:-harnessmesh-marketplace}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://harnessmesh-minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing local/\"$${HARNESSMESH_MARKETPLACE_BUCKET}\""]
    restart: "no"

  # Fresh Docker volumes are created as root-owned. Initialize the shared
  # SQLite volume before the unprivileged MCP/bridge services start.
  harnessmesh-data-init:
    profiles: ["mcp", "bridge", "worker"]
    build:
      context: .
    user: "0:0"
    volumes:
      - harnessmesh-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /data"]
    restart: "no"

  harnessmesh:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ./harnessmesh.json:/etc/harnessmesh/harnessmesh.json:ro
    environment:
      HOME: /tmp/harnessmesh-home
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - print-config
      - --config
      - /etc/harnessmesh/harnessmesh.json

  # Remote MCP server (e.g. for a ChatGPT remote MCP connector). Not started
  # by default; enable explicitly with `docker compose --profile mcp up`.
  # HARNESSMESH_MCP_TOKEN must be set in the environment - there is no
  # default, and the server refuses to start without it.
  harnessmesh-mcp:
    profiles: ["mcp", "chatgpt", "chatgpt-frp"]
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ${HARNESSMESH_MCP_CONFIG:-./harnessmesh.json}:/etc/harnessmesh/harnessmesh.json:ro
      - harnessmesh-data:/data
    environment:
      HOME: /data
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_MCP_TOKEN: ${HARNESSMESH_MCP_TOKEN:?HARNESSMESH_MCP_TOKEN must be set}
      HARNESSMESH_SECRET_BACKEND: ${HARNESSMESH_SECRET_BACKEND:-local}
      HARNESSMESH_SECRET_KEY: ${HARNESSMESH_SECRET_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-http://harnessmesh-vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      HARNESSMESH_VAULT_MOUNT: ${HARNESSMESH_VAULT_MOUNT:-secret}
      HARNESSMESH_DASHBOARD_OAUTH_INTROSPECTION_URL: ${HARNESSMESH_DASHBOARD_OAUTH_INTROSPECTION_URL:-}
      HARNESSMESH_DASHBOARD_OAUTH_CLIENT_ID: ${HARNESSMESH_DASHBOARD_OAUTH_CLIENT_ID:-harnessmesh-dashboard}
      HARNESSMESH_DASHBOARD_OAUTH_CLIENT_SECRET: ${HARNESSMESH_DASHBOARD_OAUTH_CLIENT_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: ${HARNESSMESH_MCP_MEMORY_LIMIT:-512m}
    cpus: ${HARNESSMESH_MCP_CPUS:-2.0}
    # Loopback-only by default. Put a TLS-terminating reverse proxy or the
    # OpenAI-supported secure tunnel mechanism in front for remote access -
    # see docs/chatgpt-integration.md. Never publish 0.0.0.0 here.
    ports:
      - "127.0.0.1:8787:8787"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - mcp
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --repo
      - /workspace
      - --listen
      - 0.0.0.0:8787
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      harnessmesh-data-init:
        condition: service_completed_successfully

  # Local REST+WebSocket bridge for the VS Code extension. Not started by
  # default; enable explicitly with `docker compose --profile bridge up`.
  # In most developer setups this runs on the host via `harnessmesh bridge
  # serve` instead of in a container, since the VS Code extension host
  # itself runs on the host - this service exists for containerized/remote
  # development environments.
  harnessmesh-bridge:
    profiles: ["bridge"]
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ./harnessmesh.json:/etc/harnessmesh/harnessmesh.json:ro
      - harnessmesh-data:/data
    environment:
      HOME: /data
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_BRIDGE_TOKEN: ${HARNESSMESH_BRIDGE_TOKEN:?HARNESSMESH_BRIDGE_TOKEN must be set}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: ${HARNESSMESH_BRIDGE_MEMORY_LIMIT:-256m}
    cpus: ${HARNESSMESH_BRIDGE_CPUS:-1.0}
    ports:
      - "127.0.0.1:8788:8788"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - bridge
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --repo
      - /workspace
      - --listen
      - 0.0.0.0:8788
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8788/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      harnessmesh-data-init:
        condition: service_completed_successfully

  # Durable worker pool. Multiple replicas coordinate through the configured
  # store leases; use PostgreSQL for multi-process production deployments.
  harnessmesh-worker:
    profiles: ["worker"]
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ${HARNESSMESH_MCP_CONFIG:-./harnessmesh.json}:/etc/harnessmesh/harnessmesh.json:ro
      - harnessmesh-data:/data
    environment:
      HOME: /data
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_POSTGRES_DSN: ${HARNESSMESH_POSTGRES_DSN:-}
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    command: ["jobs", "worker", "--owner", "compose-worker", "--concurrency", "${HARNESSMESH_WORKER_CONCURRENCY:-2}"]
    depends_on:
      harnessmesh-data-init:
        condition: service_completed_successfully

  # Codex-compatible model-provider gateway (POST /v1/responses). Not
  # started by default; enable explicitly with `docker compose --profile
  # provider up`. This service has no collaboration-plane state at all - it
  # does not mount the harnessmesh-data volume - and never needs
  # OPENAI_API_KEY unless an operator has deliberately disabled
  # zero_credit_mode and configured an "openai-api" backend (not done
  # here). By default it only reaches the "local" backend on the Docker
  # network's host gateway; adjust HARNESSMESH_PROVIDER_LOCAL_BACKEND_URL
  # to point at your actual local inference server.
  # The default config below selects chatgpt-subscription. Override
  # HARNESSMESH_PROVIDER_CONFIG for a local/Bedrock profile.
  harnessmesh-provider:
    profiles: ["provider"]
    build:
      context: .
    user: "${HARNESSMESH_UID:-10001}:${HARNESSMESH_GID:-10001}"
    working_dir: /workspace
    volumes:
      - ${HARNESSMESH_REPO:-.}:/workspace
      - ${HARNESSMESH_PROVIDER_CONFIG:-./configs/codex-chatgpt.example.json}:/etc/harnessmesh/harnessmesh.json:ro
      # The loopback OAuth callback runs on the host. Sharing this directory
      # lets the container reuse the host-authorized SIWC credential and
      # refresh it when necessary.
      - ${HARNESSMESH_SIWC_HOME:-./.harnessmesh}:/data/.harnessmesh
    environment:
      HOME: /data
      HARNESSMESH_PROVIDER_TOKEN: ${HARNESSMESH_PROVIDER_TOKEN:?HARNESSMESH_PROVIDER_TOKEN must be set}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: ${HARNESSMESH_PROVIDER_MEMORY_LIMIT:-512m}
    cpus: ${HARNESSMESH_PROVIDER_CPUS:-2.0}
    ports:
      - "127.0.0.1:8789:8789"
    entrypoint:
      - /usr/local/bin/harnessmesh
    command:
      - provider
      - serve
      - --config
      - /etc/harnessmesh/harnessmesh.json
      - --listen
      - 0.0.0.0:8789
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8789/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Optional local Vault for development and integration tests. Use
  # HARNESSMESH_SECRET_BACKEND=vault and VAULT_TOKEN=dev-root-token when
  # enabling this profile. Production deployments must use a non-dev Vault.
  harnessmesh-vault:
    profiles: ["vault"]
    image: hashicorp/vault:1.18
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:${HARNESSMESH_VAULT_PORT:-8200}:8200"
    volumes:
      - harnessmesh-vault-data:/vault/file
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local OIDC/MFA integration harness. Importing the realm makes the
  # introspection contract reproducible; production must use a managed
  # Keycloak deployment and a non-development client secret.
  harnessmesh-keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-admin-password}
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    ports:
      - "127.0.0.1:${HARNESSMESH_KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
      - harnessmesh-keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Run an online SQLite backup and copy the append-only knowledge archive.
  # Usage: docker compose --profile backup run --rm harnessmesh-backup
  harnessmesh-backup:
    profiles: ["backup"]
    build:
      context: .
    user: "${HARNESSMESH_UID:-10001}:${HARNESSMESH_GID:-10001}"
    volumes:
      - harnessmesh-data:/data:ro
      - ${HARNESSMESH_BACKUP_DIR:-./backups}:/backup
    environment:
      HARNESSMESH_DB_PATH: /data/harnessmesh.db
      HARNESSMESH_KNOWLEDGE_PATH: /data/knowledge.hmkz
      HARNESSMESH_BACKUP_DIR: /backup
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/harnessmesh-backup

  # Restore is deliberately separate and requires an explicit confirmation.
  # Stop mcp/bridge/provider before restoring shared state.
  harnessmesh-restore:
    profiles: ["backup"]
    build:
      context: .
    user: "${HARNESSMESH_UID:-10001}:${HARNESSMESH_GID:-10001}"
    volumes:
      - harnessmesh-data:/data
      - ${HARNESSMESH_BACKUP_DIR:-./backups}:/backup:ro
    environment:
      HARNESSMESH_DATA_DIR: /data
      HARNESSMESH_RESTORE_SERVICES_STOPPED: ${HARNESSMESH_RESTORE_SERVICES_STOPPED:-0}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/harnessmesh-restore

  # Local OTLP receiver for logs and traces. The debug exporter writes the
  # redacted records to collector logs; production can replace this config
  # with Loki, Jaeger or another OpenTelemetry exporter.
  harnessmesh-otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${HARNESSMESH_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${HARNESSMESH_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${HARNESSMESH_OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  # Persistent collaboration-state database (tasks, findings, evidence,
  # reviews, decisions) so it survives container restarts, per HarnessMesh's
  # durability requirements. Never mounted read_only.
  harnessmesh-data:
  harnessmesh-vault-data:
  harnessmesh-keycloak-data:
  harnessmesh-objectstore-data:

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://harnessmesh-mcp:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /healthz { proxy_pass http://harnessmesh-mcp:8787/healthz; }
  location = /readyz { proxy_pass http://harnessmesh-mcp:8787/readyz; }
  location = /metrics { proxy_pass http://harnessmesh-mcp:8787/metrics; }
  location / { try_files $uri $uri/ /index.html; }
}

{{- if .Values.edgeGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harnessmesh.fullname" . }}-edge-gateway
spec:
  replicas: {{ .Values.edgeGateway.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "harnessmesh.name" . }}, harnessmesh/component: edge-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "harnessmesh.name" . }}, harnessmesh/component: edge-gateway }
    spec:
      containers:
        - name: edge-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["bridge", "serve"]
          envFrom: [{ secretRef: { name: {{ .Values.edgeGateway.secretName }} } }]
          ports: [{ name: http, containerPort: 8791 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harnessmesh.fullname" . }}-mcp
  labels:
    {{- include "harnessmesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/component: mcp, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "harnessmesh.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["mcp", "serve", "--config", "/etc/harnessmesh/harnessmesh.json", "--repo", "/workspace", "--listen", "0.0.0.0:8787"]
          ports: [{ name: http, containerPort: 8787 }]
          envFrom: [{ configMapRef: { name: {{ include "harnessmesh.fullname" . }}-config } }]
          env:
            - name: HARNESSMESH_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.secretKeys.mcpToken }} } }
            - name: HARNESSMESH_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.secretKeys.adminToken }} } }
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.secretKeys.vaultToken }} } }
            - name: HARNESSMESH_POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.secretKeys.postgresDSN }} } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: config, mountPath: /etc/harnessmesh }, { name: tmp, mountPath: /tmp }]
      volumes:
        - name: config
          configMap: { name: {{ include "harnessmesh.fullname" . }}-config }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 256Mi }

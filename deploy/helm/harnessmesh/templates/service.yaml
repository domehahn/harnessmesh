apiVersion: v1
kind: Service
metadata:
  name: {{ include "harnessmesh.fullname" . }}
  labels:
    {{- include "harnessmesh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/component: mcp, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harnessmesh.fullname" . }}-worker
  labels:
    {{- include "harnessmesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "harnessmesh.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["jobs", "worker", "--owner", "$(POD_NAME)", "--concurrency", "{{ .Values.worker.concurrency }}"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: HARNESSMESH_POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.secretKeys.postgresDSN }} } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }

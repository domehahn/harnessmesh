{{- if .Values.operator.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentfleets.harnessmesh.io
spec:
  group: harnessmesh.io
  scope: Namespaced
  names: { plural: agentfleets, singular: agentfleet, kind: AgentFleet, shortNames: [hmfleet] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas: { type: integer, minimum: 0 }
                region: { type: string }
                networkPolicy: { type: string }
                sandboxProfile: { type: string }
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: harnessmesh-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: harnessmesh-worker }
  template:
    metadata:
      labels: { app: harnessmesh-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: harnessmesh:local
          imagePullPolicy: IfNotPresent
          args: ["jobs", "worker", "--owner", "$(POD_NAME)", "--concurrency", "2"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: HARNESSMESH_POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: harnessmesh-runtime, key: postgres-dsn } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }

services:
  frps:
    image: ${FRPS_IMAGE:-fatedier/frps:v0.61.2}
    restart: unless-stopped
    command: ["frps", "-c", "/etc/frp/frps.toml"]
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    ports:
      - "7000:7000/tcp"
      - "8787:8787/tcp"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2}
    restart: unless-stopped
    depends_on: [frps]
    environment:
      HARNESSMESH_MCP_DOMAIN: ${HARNESSMESH_MCP_DOMAIN:?set the public MCP domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy-data:
  caddy-config:

# Production hardening overlay.
# Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.production.yaml --profile mcp up -d
#
# The production config requires managed agents to use Bubblewrap's private
# network namespace (`network_mode: none`). Control-plane egress remains
# deployment-configurable for OAuth/tunnels and local inference backends.
x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  harnessmesh-console:
    profiles: ["console"]
    init: true
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-harnessmesh-dashboard}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
    ports:
      - "127.0.0.1:${HARNESSMESH_CONSOLE_PORT:-3000}:80"
    depends_on:
      harnessmesh-mcp:
        condition: service_healthy
    pids_limit: ${HARNESSMESH_CONSOLE_PIDS_LIMIT:-64}
    mem_limit: ${HARNESSMESH_CONSOLE_MEMORY_LIMIT:-128m}
    cpus: ${HARNESSMESH_CONSOLE_CPUS:-0.5}
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    logging: *production-logging

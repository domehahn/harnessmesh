<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>HarnessMesh Control Plane</title><link rel="stylesheet" href="/dashboard/assets/styles.css"></head>
<body>
<div class="app-shell">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">H</span><span>HarnessMesh</span></div><div class="tenant-pill" id="tenantLabel">No tenant connected</div><nav id="nav"><button class="nav-item active" data-view="overview">Overview</button><button class="nav-item" data-view="sessions">Sessions</button><button class="nav-item" data-view="jobs">Jobs</button><button class="nav-item" data-view="approvals">Approvals</button><button class="nav-item" data-view="usage">Usage & Billing</button><button class="nav-item" data-view="monitoring">Monitoring</button></nav><div class="sidebar-foot"><span class="status-dot"></span><span id="connectionState">Disconnected</span></div></aside>
  <main class="main"><header class="topbar"><div><p class="eyebrow">CONTROL PLANE</p><h1 id="pageTitle">Tenant overview</h1></div><div class="top-actions"><button class="icon-button" id="refreshButton" title="Refresh data">↻</button><button class="avatar" id="identityButton">?</button></div></header>
  <section class="connect-card" id="connectCard"><div><strong>Connect your tenant</strong><p>Use a HarnessMesh API key. It stays in this browser session and is never sent anywhere except this server.</p></div><div class="connect-form"><input id="apiKey" type="password" autocomplete="off" placeholder="hm_… API key"><button class="primary" id="connectButton">Connect</button></div><p class="error hidden" id="connectError"></p></section>
  <section id="content" class="content"></section>
  </main>
</div><script src="/dashboard/assets/app.js" defer></script>
</body></html>

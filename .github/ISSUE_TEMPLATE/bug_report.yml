name: Bug report
description: Report a reproducible HarnessMesh defect
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include HarnessMesh version, agent CLI versions, config with secrets removed, and steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HarnessMesh version
      placeholder: "0.3.0 or commit SHA"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed tokens, credentials, private source code, transcripts, and personal data.
          required: true

name: Release Install Matrix

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tagged CLI
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          if [ -z "$ref" ] || [ "$ref" = "release-matrix" ]; then ref="$(git describe --tags --abbrev=0 2>/dev/null || true)"; fi
          test -n "$ref"
          CGO_ENABLED=1 go install "github.com/domehahn/harnessmesh/cmd/harnessmesh@${ref}"
          bin="$(go env GOPATH)/bin/harnessmesh"
          [ -x "$bin" ] || bin="$(go env GOPATH)/bin/harnessmesh.exe"
          "$bin" version
          "$bin" --help >/dev/null

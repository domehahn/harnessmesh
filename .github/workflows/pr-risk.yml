name: PR Risk Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply change-size and risk labels
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const changed = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const names = files.map(file => file.filename);
            const labels = new Set();
            if (changed >= 800 || files.length >= 30) labels.add('large-change');
            if (names.some(name => /^(internal\\/(auth|executil|secrets|mcp)|SECURITY\\.md|\.github\\/workflows)/.test(name))) labels.add('security');
            if (names.some(name => /^(docs\\/api|internal\\/protocol|internal\\/mcp|docs\\/api\\/openapi\\.json)/.test(name))) labels.add('protocol');
            if (names.some(name => /(^|\\/)(go\\.mod|go\\.sum|package-lock\\.json|package\\.json)$/.test(name))) labels.add('dependencies');
            if (labels.size) {
              await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: [...labels] });
            }

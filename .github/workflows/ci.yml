name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

      - name: Fuzz seed and load benchmarks
        run: |
          go test ./internal/knowledge -run FuzzArchiveSearchDoesNotPanic
          go test ./internal/knowledge -bench . -benchtime=100ms -run '^$'

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Build
        run: go build ./cmd/harnessmesh

      - name: Validate examples
        run: |
          python3 -m json.tool configs/harnessmesh.example.json >/dev/null
          python3 -m json.tool configs/harnessmesh.switchyard.example.json >/dev/null

      - name: Docker build
        run: docker build .

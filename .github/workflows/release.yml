name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test and build
        run: |
          go test ./...
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/harnessmesh ./cmd/harnessmesh
      - name: Generate checksum and SBOM
        run: |
          sha256sum dist/harnessmesh > dist/SHA256SUMS
          docker run --rm -v "$PWD":/src anchore/syft:latest dir:/src -o cyclonedx-json=/src/dist/sbom.cdx.json
      - name: Sign artifacts
        uses: sigstore/cosign-installer@v3
      - name: Keyless sign checksum
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig dist/SHA256SUMS
      - name: Attest CLI binary provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/harnessmesh
      - name: Verify release binary
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          test "$(dist/harnessmesh version)" = "${EXPECTED_VERSION#v}"
          sha256sum --check dist/SHA256SUMS
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish MCP image
        id: mcp-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Build and publish console image
        id: console-image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-console:${{ github.ref_name }}
      - name: Sign published container images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-console:${GITHUB_REF_NAME}"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

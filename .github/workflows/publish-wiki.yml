name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          if ! git clone "$WIKI_REMOTE" "$tmp_dir/wiki"; then
            echo "::error::The GitHub Wiki has not been initialized yet. Open the repository Wiki tab, create the first page once, then re-run this workflow."
            exit 1
          fi

          find "$tmp_dir/wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. "$tmp_dir/wiki/"

          cd "$tmp_dir/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync HarnessMesh wiki"
          git push origin HEAD

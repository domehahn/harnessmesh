# Canonical repository labels. Keep GitHub labels aligned with this file.
- name: bug
  color: d73a4a
  description: Something is not working
- name: enhancement
  color: a2eeef
  description: New capability or improvement
- name: documentation
  color: 0075ca
  description: Documentation-only change
- name: security
  color: b60205
  description: Security or privacy impact
- name: performance
  color: f9d0c4
  description: Performance, latency, or resource usage
- name: adapter
  color: 5319e7
  description: Harness or provider adapter
- name: protocol
  color: 1d76db
  description: Public protocol, MCP, or compatibility change
- name: good first issue
  color: 7057ff
  description: Suitable for a new contributor
- name: help wanted
  color: 008672
  description: Maintainers welcome community help
- name: breaking change
  color: b60205
  description: Requires migration or compatibility work
- name: release
  color: 1d76db
  description: Release engineering and versioning
- name: ui
  color: 5319e7
  description: React console and UX
- name: orchestration
  color: 0052cc
  description: Agent orchestration and collaboration
- name: mcp
  color: 0e8a16
  description: Model Context Protocol integrations
- name: plugin
  color: fbca04
  description: External agent plugins and adapters
- name: identity
  color: b60205
  description: OIDC, Keycloak and authentication
- name: production-readiness
  color: d93f0b
  description: Production deployment and operations
- name: observability
  color: c2e0c6
  description: Metrics, logs and monitoring
